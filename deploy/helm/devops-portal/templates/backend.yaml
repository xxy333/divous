apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      containers:
        - name: portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: APP_BASE_URL
              value: {{ .Values.env.appBaseUrl | quote }}
            - name: POST_LOGIN_REDIRECT
              value: {{ .Values.env.postLoginRedirect | quote }}
            - name: OIDC_ISSUER
              value: {{ .Values.env.oidcIssuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.env.oidcClientId | quote }}
            - name: OIDC_REDIRECT_URI
              value: {{ .Values.env.oidcRedirectUri | quote }}
            - name: OIDC_REQUIRE_AUDIENCE
              value: {{ .Values.env.oidcRequireAudience | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.env.cookieSecure | quote }}
            - name: COOKIE_SAMESITE
              value: {{ .Values.env.cookieSameSite | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: portal-secrets
                  key: OIDC_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: portal-secrets
                  key: SESSION_SECRET
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001

---
apiVersion: v1
kind: Service
metadata:
  name: portal
spec:
  selector:
    app: portal
  ports:
    - name: http
      port: 80
      targetPort: 8000